{% extends "base.html" %}
{% block title %}Moderate Post — WhistleVault{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto" data-post-id="{{ post_id }}">

  <a href="{{ url_for('admin.dashboard') }}" class="text-sm text-vault-400 hover:text-vault-200 inline-flex items-center gap-1 mb-4">← Back to admin panel</a>

  <article id="admin-post-detail" class="bg-vault-900/60 border border-vault-800 rounded-xl p-6 mb-8">
    <div class="animate-pulse space-y-3">
      <div class="h-6 bg-vault-800 rounded w-3/4"></div>
      <div class="h-4 bg-vault-800 rounded w-1/3"></div>
      <div class="h-24 bg-vault-800 rounded"></div>
    </div>
  </article>

  <section>
    <h2 class="text-lg font-bold mb-4">Comments (moderation view)</h2>
    <div id="admin-comments-container" class="space-y-4"></div>
    <div id="admin-comments-empty" class="hidden text-center py-10 text-vault-500 text-sm">No comments on this post.</div>
  </section>
</div>

<template id="admin-comment-template">
  <div class="comment-node">
    <div class="bg-vault-900/40 border border-vault-800 rounded-lg p-4">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-medium text-vault-300 flex items-center gap-1.5">
          <span class="comment-author"></span>
          <span class="op-badge hidden text-[10px] font-bold px-1.5 py-0.5 rounded bg-signal-500 text-vault-950">OP</span>
        </span>
        <span class="comment-time text-xs text-vault-600"></span>
      </div>
      <p class="comment-content text-sm text-vault-100 whitespace-pre-wrap break-words"></p>
      <button class="delete-comment-btn mt-2 text-xs text-rose-400 hover:text-rose-300 font-medium">Remove comment</button>
    </div>
    <div class="replies-container ml-5 mt-3 space-y-3 border-l border-vault-800 pl-4"></div>
  </div>
</template>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin_post_detail.js') }}"></script>
{% endblock %}
