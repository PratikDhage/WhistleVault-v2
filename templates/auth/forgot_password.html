{% extends "base.html" %}
{% block title %}Forgot password — WhistleVault{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-1">Reset your password</h1>
    <p class="text-vault-400 text-sm mb-6">Enter the email address associated with your account.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}"
        class="space-y-4 bg-vault-900/60 border border-vault-800 rounded-xl p-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium text-vault-300 mb-1.5">Email address</label>
            <input name="email" type="email" required autofocus autocomplete="email"
                class="w-full bg-vault-950 border border-vault-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-vault-500">
        </div>
        <button type="submit"
            class="w-full bg-signal-500 hover:bg-orange-500 text-vault-950 font-semibold rounded-lg py-2.5 transition-colors">
            Send reset link
        </button>
    </form>

    <p class="text-center text-sm text-vault-400 mt-4">
        Remembered it? <a href="{{ url_for('auth.login') }}" class="text-vault-200 underline">Back to login</a>
    </p>
</div>
{% endblock %}
