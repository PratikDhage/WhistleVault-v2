{% extends "base.html" %}
{% block title %}Choose a new password — WhistleVault{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-1">Choose a new password</h1>
    <p class="text-vault-400 text-sm mb-6">Use at least 8 characters, then confirm your new password.</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}"
        class="space-y-4 bg-vault-900/60 border border-vault-800 rounded-xl p-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium text-vault-300 mb-1.5">New password</label>
            <input name="password" type="password" required minlength="8" autocomplete="new-password"
                class="w-full bg-vault-950 border border-vault-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-vault-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-vault-300 mb-1.5">Confirm new password</label>
            <input name="confirmation" type="password" required minlength="8" autocomplete="new-password"
                class="w-full bg-vault-950 border border-vault-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-vault-500">
        </div>
        <button type="submit"
            class="w-full bg-signal-500 hover:bg-orange-500 text-vault-950 font-semibold rounded-lg py-2.5 transition-colors">
            Update password
        </button>
    </form>
</div>
{% endblock %}
