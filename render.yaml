# Render Blueprint for WhistleVault.
# https://render.com/docs/blueprint-spec
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# New -> Blueprint and point it at the repo. Render will read this file
# and provision the web service below.
#
# Database: this project uses an external managed PostgreSQL database.
# Set DATABASE_URL to the connection string from Neon in the Render
# environment settings.
#
# Migrations run as part of buildCommand so the schema is updated before
# the web service starts.

services:
  - type: web
    name: whistlevault
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt && flask --app app db upgrade"
    startCommand: "gunicorn app:app --workers 4 --threads 2 --timeout 60 --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PASSWORD_RESET_EXPIRY_MINUTES
        value: "30"
      - key: MAIL_PROVIDER
        value: smtp
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_TIMEOUT_SECONDS
        value: "8"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
